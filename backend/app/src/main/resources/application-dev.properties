spring.application.name=googleRiser
server.port=8080

# Local Database
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=your_postgres_password

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local Redis
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.cache-names=location,friend-cooldown

# JWT Secret (Using default fallback for local dev)
jwt.secret=${JWT_SECRET:local_dev_secret_key}

# Gemini API
gemini.api.key=${GEMINI_API_KEY:your_local_api_key}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent