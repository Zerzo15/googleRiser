spring.application.name=googleRiser
server.port=8080

# Local Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Local Redis
spring.cache.type=redis
spring.data.redis.enabled=${SPRING_DATA_REDIS_ENABLED:false}
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.cache-names=location,friend-cooldown

# JWT Secret (Base64, 256+ bits; replace with JWT_SECRET outside local preview)
jwt.secret=${JWT_SECRET:bG9jYWxfZGV2X3NlY3JldF9rZXlfZm9yX2Rldl9vbmx5XzMyYnl0ZXM=}

# Server-side AI provider (keep credentials out of the frontend)
ai.api.key=${AI_API_KEY:${DEEPSEEK_API_KEY:}}
ai.api.url=${AI_API_URL:https://api.deepseek.com/responses}
ai.api.model=${AI_MODEL:deepseek-v4-flash}
