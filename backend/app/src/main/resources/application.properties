spring.application.name=googleRiser
server.port=${PORT:8080}

# Spring Boot Docker Compose disable in container
spring.docker.compose.enabled=false

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql:///postgres?cloudSqlInstance=project-25c8d146-3e11-498c-a31:asia-southeast1:riser-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.cache-names=location,friend-cooldown

# JWT Secret
jwt.secret=${JWT_SECRET}

gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent}
