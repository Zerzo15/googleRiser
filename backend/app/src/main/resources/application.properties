spring.application.name=googleRiser
server.port=${PORT:8080}

# Spring Boot Docker Compose disable in container
spring.docker.compose.enabled=false

# Database Configuration (Injected via GCP Cloud Run env variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://34.142.167.250:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.cache-names=location,friend-cooldown

# JWT Secret
jwt.secret=${JWT_SECRET:ZzBPZ2xlUmkkZXIyMDA2MjAyNnxVJHVNL1NpMG53RXNTdm4=}