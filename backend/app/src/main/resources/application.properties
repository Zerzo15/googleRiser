spring.application.name=googleRiser
server.port=${PORT:8080}

# Spring Boot Docker Compose disable in container
spring.docker.compose.enabled=false

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql:///postgres?cloudSqlInstance=project-25c8d146-3e11-498c-a31:asia-southeast1:riser-db&socketFactory=com.google.cloud.sql.postgres.SocketFactory}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.cache-names=location,friend-cooldown

# JWT Secret
jwt.secret=${JWT_SECRET}

deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=${DEEPSEEK_API_URL:deepseek.api.url=https://api.deepseek.com/chat/completions}
deepseek.api.model=${DEEPSEEK_API_MODEL:deepseek-v4-flash}
